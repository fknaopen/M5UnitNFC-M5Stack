name: Build(esp-idf-native)

env:
  IDF_TARGET: esp32s3

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'CMakeLists.txt'
      - 'idf_component.yml'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - 'examples/UnitUnified/**/CMakeLists.txt'
      - 'examples/UnitUnified/**/Kconfig.projbuild'
      - 'examples/UnitUnified/common/**'
      - '.github/workflows/esp-idf-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'CMakeLists.txt'
      - 'idf_component.yml'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - 'examples/UnitUnified/**/CMakeLists.txt'
      - 'examples/UnitUnified/**/Kconfig.projbuild'
      - 'examples/UnitUnified/common/**'
      - '.github/workflows/esp-idf-build-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.idf }} ${{ matrix.example_config.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Last patch of each ESP-IDF 5.x minor — covers legacy driver/* APIs (v5.1-v5.3)
        # and the new driver/*_master.h / driver/touch_sens.h APIs (v5.4+).
        # NOTE: v5.0.x is excluded because M5GFX requires the esp_mm component, which was
        # introduced in v5.1; building against v5.0.x fails with "Failed to resolve component 'esp_mm'".
        # NOTE: M5HAL fixed the esp_driver_gpio version boundary (was 5.2, now 5.3 — esp_driver_gpio
        # was actually split out in v5.3, not v5.2). M5UnitUnified added guards for the new
        # i2c_master_bus_handle_t API (v5.2+). With both fixes upstream, v5.1.7 / v5.2.7 build again.
        idf:
          - v5.1.7
          - v5.2.7
          - v5.3.5
          - v5.4.4
          - v5.5.4
        # M5Unit-NFC ships UnitNFC (I2C) and CapCC1101NFC (SPI). One example per family
        # Kconfig file (full / no_dial / basic), each built with both variants = 6 configs.
        example_config:
          - label: NFCA-Detect-UnitNFC (full)
            example_path: examples/UnitUnified/NFCA/Detect
            variant: USING_UNIT_NFC
          - label: NFCA-Detect-CapCC1101 (full)
            example_path: examples/UnitUnified/NFCA/Detect
            variant: USING_CAP_CC1101
          - label: NFCB-Detect-UnitNFC (no_dial)
            example_path: examples/UnitUnified/NFCB/Detect
            variant: USING_UNIT_NFC
          - label: NFCB-Detect-CapCC1101 (no_dial)
            example_path: examples/UnitUnified/NFCB/Detect
            variant: USING_CAP_CC1101
          - label: NFCF-Detect-UnitNFC (basic)
            example_path: examples/UnitUnified/NFCF/Detect
            variant: USING_UNIT_NFC
          - label: NFCF-Detect-CapCC1101 (basic)
            example_path: examples/UnitUnified/NFCF/Detect
            variant: USING_CAP_CC1101
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Kconfig variant
        # The example's own sdkconfig.defaults is not read (top CMakeLists points SDKCONFIG_DEFAULTS
        # at common/sdkconfig.defaults). Append the choice to common/ in the CI workspace only.
        run: |
          echo "" >> examples/UnitUnified/common/sdkconfig.defaults
          echo "CONFIG_EXAMPLE_${{ matrix.example_config.variant }}=y" >> examples/UnitUnified/common/sdkconfig.defaults

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ env.IDF_TARGET }}
          path: ${{ matrix.example_config.example_path }}
